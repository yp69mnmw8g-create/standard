<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KCD2 Companion</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app__header">
      <div class="app__brand">
        <span class="app__brand-icon">⚔️</span>
        <div>
          <h1 class="app__title">KCD2 Companion</h1>
          <p class="app__subtitle">Kingdom Come: Deliverance 2 — companion</p>
        </div>
      </div>
      <nav class="app__nav" id="nav"><!-- nav links are generated by JS --></nav>
    </header>

    <main class="app__main" id="view"><!-- content is rendered by JS --></main>

    <footer class="app__footer">
      Local website · Data is editable under <code>data/</code>
    </footer>

    <!-- Load data first (sets window.KCD2_*), then the app -->
    <script src="data/quests.js"></script>
    <script src="data/locations.js"></script>
    <script src="data/checklist.js"></script>
    <script src="data/perks.js"></script>
    <script src="app.js"></script>
  </body>
</html>
