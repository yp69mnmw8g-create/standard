name: Morgen-Übersicht

# Erzeugt die Tagesübersicht (Wetter, Kalender, Welt-Nachrichten, Geschichte,
# Wissen, Koran-Vers) und schickt sie – falls die E-Mail-Secrets gesetzt sind –
# per Mail. Bewusst OHNE GitHub-Pages-Deploy: Der Mailversand soll unabhängig
# von Pages/Umgebungs-Schutzregeln zuverlässig laufen. Die Live-Seite wird
# separat vom Workflow "Deploy to GitHub Pages" aktualisiert.
#
# Auslösung ausschließlich extern via Webhook auf den workflow_dispatch-
# Endpunkt (cron-job.org, täglich 06:30). GitHubs interner schedule-Cron wird
# bewusst NICHT genutzt: Er feuert hier Stunden zu spät und würde eine zweite
# (Nachmittags-)Mail erzeugen.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Tagesübersicht erzeugen
        env:
          # Veröffentlichte Kalender-Links (kommagetrennt) und optional die Stadt
          # kommen aus Repository-Secrets, damit sie nicht im Code stehen.
          CALENDAR_URLS: ${{ secrets.CALENDAR_URLS }}
          WEATHER_CITY: ${{ secrets.WEATHER_CITY }}
        run: node morning/generate.js

      - name: Datum für Betreff
        id: meta
        run: echo "date=$(TZ=Europe/Berlin date '+%d.%m.%Y')" >> "$GITHUB_OUTPUT"

      - name: Per E-Mail verschicken
        # Läuft nur, wenn ein Mail-Passwort als Secret hinterlegt ist.
        env:
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        if: ${{ env.MAIL_PASSWORD != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.mail.me.com
          server_port: 587
          secure: false
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "☀️ Deine Morgen-Übersicht – ${{ steps.meta.outputs.date }}"
          to: ${{ secrets.MAIL_TO }}
          from: Morgen-Übersicht <${{ secrets.MAIL_USERNAME }}>
          html_body: file://morning/index.html
